<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">

<style>
  :root{
    --ink:#141C25; --ink-2:#4C5C6B; --ink-3:#8A98A5;
    --mat:#D7DEE4; --mat-line:#CAD3DA; --panel:#F1F5F7; --paper:#fff;
    --mark:#FFD84D; --gap:#BE443A; --ok:#2E6B58; --edge:#B4C0CA;
    --display:'Space Grotesk',system-ui,-apple-system,sans-serif;
    --mono:'IBM Plex Mono',ui-monospace,Menlo,monospace;
    --doc:Georgia,'Times New Roman',serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;height:100%}
  body{
    font-family:var(--display); color:var(--ink); background:var(--mat);
    background-image:linear-gradient(var(--mat-line) 1px,transparent 1px),linear-gradient(90deg,var(--mat-line) 1px,transparent 1px);
    background-size:28px 28px;
    -webkit-font-smoothing:antialiased;
  }
  button,input,textarea,select{font:inherit;color:inherit}
  ::selection{background:var(--mark)}

  /* ---------- shell ---------- */
  .app{display:flex;flex-direction:column;height:100vh}
  .bar{
    display:flex;align-items:center;gap:20px;flex-wrap:wrap;
    padding:12px 20px;border-bottom:2px solid var(--ink);background:var(--panel);
  }
  .wordmark{font-weight:700;font-size:15px;letter-spacing:-.02em;white-space:nowrap}
  .wordmark em{font-style:normal;background:var(--mark);padding:0 5px}
  .modes{display:flex;gap:2px;margin-right:auto;flex-wrap:wrap}
  .modes button{
    font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;
    background:transparent;border:1px solid transparent;border-bottom:none;
    padding:8px 13px 9px;cursor:pointer;color:var(--ink-2);border-radius:3px 3px 0 0;
    margin-bottom:-13px;
  }
  .modes button:hover{color:var(--ink);background:#e6ecf0}
  .modes button[aria-selected="true"]{background:var(--paper);border-color:var(--ink);color:var(--ink);font-weight:600}
  .bar .right{display:flex;align-items:center;gap:8px}
  .saved{font-family:var(--mono);font-size:10px;color:var(--ink-3);letter-spacing:.06em;text-transform:uppercase}

  .btn{
    font-family:var(--mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;
    background:var(--paper);border:1.5px solid var(--ink);padding:8px 13px;cursor:pointer;border-radius:3px;
  }
  .btn:hover{background:var(--mark)}
  .btn:active{transform:translateY(1px)}
  .btn.solid{background:var(--ink);color:#fff}
  .btn.solid:hover{background:#000}
  .btn.ghost{border-color:var(--edge);color:var(--ink-2);background:transparent}
  .btn.ghost:hover{border-color:var(--ink);color:var(--ink);background:transparent}
  .btn.sm{padding:5px 9px;font-size:10px}
  .btn:disabled{opacity:.45;cursor:not-allowed}
  .btn:focus-visible,input:focus-visible,textarea:focus-visible,.modes button:focus-visible{outline:2px solid var(--ink);outline-offset:2px}

  .split{display:grid;grid-template-columns:minmax(340px,1fr) minmax(420px,1.15fr);flex:1;min-height:0}
  .tools{overflow-y:auto;padding:22px;border-right:2px solid var(--ink)}
  .stage{overflow-y:auto;padding:26px 22px 60px;display:flex;flex-direction:column;align-items:center;gap:14px}

  /* ---------- panels ---------- */
  .panel{background:var(--paper);border:1.5px solid var(--edge);border-radius:4px;padding:16px;margin-bottom:14px}
  .panel > h3{
    margin:0 0 4px;font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;font-weight:600;
  }
  .hint{font-size:12.5px;line-height:1.5;color:var(--ink-2);margin:0 0 12px}
  .hint b{color:var(--ink);font-weight:500}
  label{display:block;font-family:var(--mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2);margin:10px 0 4px}
  input[type=text],textarea{
    width:100%;background:#FAFCFD;border:1.5px solid var(--edge);border-radius:3px;padding:8px 9px;font-size:13.5px;font-family:var(--display);
  }
  textarea{resize:vertical;line-height:1.55}
  input:focus,textarea:focus{border-color:var(--ink);background:#fff}
  .row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .row-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}

  .role{border:1.5px solid var(--edge);border-radius:4px;padding:13px;margin-bottom:11px;background:var(--paper)}
  .role-head{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:2px}
  .role-head .n{font-family:var(--mono);font-size:10px;color:var(--ink-3);letter-spacing:.1em}
  .empty{border:1.5px dashed var(--edge);border-radius:4px;padding:22px 16px;text-align:center;font-size:13px;color:var(--ink-2);line-height:1.6}

  /* ---------- keyword chips ---------- */
  .chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
  .chip{font-family:var(--mono);font-size:11px;padding:4px 8px;border-radius:3px;border:1px solid var(--edge);background:#fff}
  .chip.hit{border-color:var(--ok);color:var(--ok)}
  .chip.hit::before{content:"✓ ";}
  .chip.miss{border-color:var(--gap);color:var(--gap);text-decoration:underline wavy var(--gap);text-underline-offset:3px}

  /* ---------- score ---------- */
  .score-num{font-size:56px;font-weight:700;letter-spacing:-.04em;line-height:1}
  .score-num small{font-family:var(--mono);font-size:13px;font-weight:400;color:var(--ink-3);letter-spacing:0}
  .meter{height:7px;background:#E7EDF1;border-radius:99px;overflow:hidden;margin:5px 0 2px}
  .meter i{display:block;height:100%;background:var(--ink)}
  .brk{margin:12px 0}
  .brk-row{margin-bottom:11px}
  .brk-row .t{display:flex;justify-content:space-between;font-size:12.5px}
  .brk-row .t span:last-child{font-family:var(--mono);color:var(--ink-2)}
  .brk-row .note{font-size:12px;color:var(--ink-2);margin-top:3px;line-height:1.45}
  ul.fixes{margin:8px 0 0;padding-left:18px}
  ul.fixes li{font-size:13px;line-height:1.55;margin-bottom:7px}

  /* ---------- variants ---------- */
  .variant{border:1.5px solid var(--edge);border-radius:4px;padding:11px 12px;margin-bottom:9px;font-size:13.5px;line-height:1.55}
  .variant:hover{border-color:var(--ink)}
  .variant .acts{display:flex;gap:6px;margin-top:9px;align-items:center}
  .doc{border:1.5px solid var(--edge);border-radius:4px;padding:11px 12px;margin-bottom:9px}
  .doc[data-open="1"]{border-color:var(--ink);background:#FFFCF0}
  .doc .t{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
  .doc .name{font-size:13.5px;font-weight:600;line-height:1.4}
  .doc .meta{font-family:var(--mono);font-size:10px;color:var(--ink-3);letter-spacing:.05em;text-transform:uppercase;margin-top:3px}
  .doc .acts{display:flex;gap:6px;margin-top:10px;align-items:center;flex-wrap:wrap}
  .doc select{font-family:var(--mono);font-size:10px;padding:5px 6px;border:1.5px solid var(--edge);border-radius:3px;background:#fff;color:var(--ink-2)}

  /* ---------- the paper ---------- */
  .sheet-head{
    width:100%;max-width:720px;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;
    font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-2);
  }
  .paper{
    width:100%;max-width:720px;background:var(--paper);border:1px solid #C9D3DA;
    box-shadow:0 1px 2px rgba(20,28,37,.10),0 12px 30px -12px rgba(20,28,37,.30);
    padding:54px 58px 64px;font-family:var(--doc);color:#111;font-size:13.4px;line-height:1.45;
  }
  .paper h1{font-size:23px;margin:0 0 3px;letter-spacing:.01em;font-weight:700}
  .paper .contact{font-size:12.2px;color:#333;margin-bottom:19px}
  .paper h2{
    font-size:12.4px;text-transform:uppercase;letter-spacing:.09em;margin:20px 0 7px;
    border-bottom:1px solid #999;padding-bottom:3px;font-weight:700;
  }
  .paper .job{margin-bottom:14px}
  .paper .job .l1{display:flex;justify-content:space-between;gap:14px;font-weight:700}
  .paper .job .l2{display:flex;justify-content:space-between;gap:14px;font-style:italic;color:#333;margin-bottom:4px}
  .paper ul{margin:3px 0 0;padding-left:17px}
  .paper li{margin-bottom:3px}
  .paper .skill-line{margin-bottom:3px}
  .paper .placeholder{color:#9aa;font-style:italic}

  .hl{
    background:linear-gradient(100deg,rgba(255,216,77,0) 0%,rgba(255,216,77,.9) 3.5%,rgba(255,216,77,.72) 96.5%,rgba(255,216,77,0) 100%);
    padding:0 .12em;border-radius:.18em;-webkit-box-decoration-break:clone;box-decoration-break:clone;
  }

  /* ---------- parser check ---------- */
  .check{width:100%;max-width:720px;background:var(--panel);border:1.5px solid var(--edge);border-radius:4px;padding:13px 15px}
  .check h4{margin:0 0 8px;font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-2);font-weight:600}
  .check ul{margin:0;padding-left:16px}
  .check li{font-size:12.5px;line-height:1.5;margin-bottom:5px;color:var(--ink-2)}
  .check li.warn{color:var(--gap)}
  .check li.pass{color:var(--ok)}

  .banner{font-family:var(--mono);font-size:11px;padding:8px 11px;border-radius:3px;margin-bottom:12px;line-height:1.5}
  .banner.err{background:#FBEAE8;border:1px solid var(--gap);color:#8C2F27}
  .banner.busy{background:#FFF6D6;border:1px solid #E0C24A;color:#6B5309}
  .spin{display:inline-block;animation:sp 1s linear infinite}
  @keyframes sp{to{transform:rotate(360deg)}}
  @media (prefers-reduced-motion:reduce){.spin{animation:none}}

  .stack{display:none}
  @media (max-width:900px){
    .split{grid-template-columns:1fr}
    .tools{border-right:none;border-bottom:2px solid var(--ink)}
    .tools[data-hide="1"],.stage[data-hide="1"]{display:none}
    .stack{display:inline-block}
    .paper{padding:34px 26px 44px}
  }

  /* ---------- section cards ---------- */
  .sec{border:1.5px solid var(--edge);border-radius:4px;margin-bottom:10px;background:var(--paper)}
  .sec.dragging{opacity:.45}
  .sec-head{display:flex;align-items:center;gap:7px;padding:9px 10px;border-bottom:1.5px solid transparent}
  .sec[data-open="1"] .sec-head{border-bottom-color:var(--mat-line)}
  .grip{cursor:grab;color:var(--ink-3);font-size:13px;line-height:1;user-select:none}
  .sec-title{
    flex:1;min-width:0;border:1px solid transparent;background:transparent;border-radius:3px;
    font-family:var(--display);font-size:13px;font-weight:600;color:var(--ink);padding:4px 6px;
  }
  .sec-title:hover{border-color:var(--mat-line)}
  .sec-title:focus{border-color:var(--ink);background:#fff}
  .badge{
    font-family:var(--mono);font-size:9px;letter-spacing:.05em;text-transform:uppercase;
    padding:3px 5px;border-radius:2px;border:1px solid var(--edge);color:var(--ink-3);white-space:nowrap;
  }
  .badge.warn{border-color:var(--gap);color:var(--gap)}
  .sec-acts{display:flex;gap:4px;flex-shrink:0}
  .sec-body{padding:11px 12px 13px}
  .seg{display:flex;gap:7px;flex-wrap:wrap;align-items:center}

  /* ---------- design picker ---------- */
  .tpl-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:7px;margin-bottom:13px}
  .tpl{
    text-align:left;display:flex;flex-direction:column;gap:3px;cursor:pointer;
    border:1.5px solid var(--edge);border-radius:4px;background:#fff;padding:9px 10px;font:inherit;
  }
  .tpl:hover{border-color:var(--ink-2)}
  .tpl[aria-pressed="true"]{border-color:var(--ink);background:#FFFCF0}
  .tpl-name{font-family:var(--display);font-size:12.5px;font-weight:600;color:var(--ink)}
  .tpl-warn{font-family:var(--mono);font-size:9px;color:var(--gap);text-transform:uppercase;letter-spacing:.04em}
  .tpl-note{font-size:11.5px;line-height:1.45;color:var(--ink-2)}
  .swatches{display:flex;gap:6px;margin-bottom:12px}
  .sw{width:26px;height:26px;border-radius:3px;border:2px solid transparent;box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.85);cursor:pointer;padding:0}
  .sw[aria-pressed="true"]{border-color:var(--ink)}

  .btn.danger{border-color:var(--gap);color:var(--gap);background:transparent}
  .btn.danger:hover{background:var(--gap);color:#fff;border-color:var(--gap)}
  .danger-zone{margin-top:13px;padding-top:12px;border-top:1px dashed var(--mat-line)}
  .danger-zone .hint{margin-bottom:10px}

  /* ---------- content check ---------- */
  .check h4{display:flex;justify-content:space-between;align-items:center;gap:10px}
  .ck-score{font-family:var(--display);font-size:19px;font-weight:700;letter-spacing:-.02em;color:var(--ink)}
  .ck-score small{font-family:var(--mono);font-size:9px;font-weight:400;color:var(--ink-3)}
  .ck-score[data-band="good"]{color:var(--ok)}
  .ck-score[data-band="low"]{color:var(--gap)}
  .ck-group{margin-bottom:9px}
  .ck-group:last-child{margin-bottom:0}
  .ck-group h5{
    margin:0 0 4px;font-family:var(--mono);font-size:9.5px;letter-spacing:.09em;
    text-transform:uppercase;color:var(--ink-3);font-weight:600;
  }
  .check li.bad{color:var(--gap);font-weight:500}

  /* ---------- paper templates ----------
     Every template keeps real headings, real lists and selectable text. Only
     `sidebar` breaks the single-column rule, and the analyser flags it. */
  .paper[data-density="tight"]{font-size:12.6px;line-height:1.34;padding:42px 46px 50px}
  .paper[data-density="tight"] h2{margin:14px 0 5px}
  .paper[data-density="tight"] .job{margin-bottom:10px}

  .paper[data-template="editorial"] h1{font-size:30px;font-weight:400;letter-spacing:.02em}
  .paper[data-template="editorial"] h2{
    border-bottom-width:.5px;border-color:var(--accent);color:var(--accent);
    letter-spacing:.18em;font-weight:400;font-size:11px;
  }
  .paper[data-template="modern"]{font-family:var(--display),var(--doc)}
  .paper[data-template="modern"] h1{letter-spacing:-.02em}
  .paper[data-template="modern"] h2{border-bottom:none;color:var(--accent);letter-spacing:.06em;margin-bottom:3px}
  .paper[data-template="modern"] .job .l2{font-style:normal;color:#555}
  .paper[data-template="compact"] h1{font-size:20px}
  .paper[data-template="compact"] h2{margin:13px 0 4px;font-size:11.4px}

  .paper[data-template="sidebar"] h2{color:var(--accent)}
  .paper .cols{display:grid;grid-template-columns:1fr 2fr;gap:0 26px;align-items:start}
  .paper .cols aside{border-right:1px solid #DDD;padding-right:22px}
  .paper .cols aside h2:first-child,.paper .cols .main h2:first-child{margin-top:6px}
  @media (max-width:700px){ .paper .cols{grid-template-columns:1fr} .paper .cols aside{border-right:none;padding-right:0} }

  @media print{
    body{background:#fff;background-image:none}
    .bar,.tools,.sheet-head,.check{display:none!important}
    .split{display:block}
    .stage{padding:0;display:block;overflow:visible}
    .paper{max-width:none;border:none;box-shadow:none;padding:0;font-size:11pt}
    .hl{background:none!important;padding:0}
    @page{margin:0.6in}
  }
</style>

<div class="app">
  <header class="bar">
    <div class="wordmark">resume<em>bench</em></div>
    <nav class="modes" role="tablist">
      <button role="tab" data-mode="profile" aria-selected="true">Profile</button>
      <button role="tab" data-mode="bullets" aria-selected="false">Bullets</button>
      <button role="tab" data-mode="tailor" aria-selected="false">Tailor</button>
      <button role="tab" data-mode="score" aria-selected="false">Score</button>
      <button role="tab" data-mode="saved" aria-selected="false">Saved</button>
    </nav>
    <div class="right">
      <span class="saved" id="saved"></span>
      <button class="btn ghost sm stack" id="flip">View resume</button>
      <button class="btn ghost sm" id="copyTxt">Copy plain text</button>
      <button class="btn solid sm" id="print">Save as PDF</button>
    </div>
  </header>

  <main class="split">
    <section class="tools" id="tools"></section>
    <section class="stage" id="stage" data-hide="0">
      <div class="sheet-head">
        <span id="sheetLabel">Master resume</span>
        <span id="sheetToggle"></span>
      </div>
      <div class="paper" id="paper"></div>
      <div class="check" id="check"></div>
    </section>
  </main>
  <input type="file" id="backupFile" accept="application/json,.json" hidden>
</div>

<script>
/* ============================ state ============================ */
const uid = () => Math.random().toString(36).slice(2,8);
const esc = s => String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const lines = s => String(s??"").split("\n").map(x=>x.trim()).filter(Boolean);
const clone = v => v==null ? v : JSON.parse(JSON.stringify(v));

/* ---------------------------- sections ----------------------------
   The resume is an ordered list of sections. Three types cover every
   shape a resume needs, so adding "Most Proud Of" is data, not code:

     text     one paragraph                       {text}
     entries  dated items with bullets            {entries:[{id,role,company,start,end,location,bullets}]}
     lines    one item per line                   {raw, layout}

   `layout` decides only how a lines section prints:
     pipe    split on | and join with —, one div per line   (Education)
     bullet  same split, rendered as a real <ul>            (Projects, Strengths)
     plain   the line verbatim                              (Skills)                 */
const SECTION_TYPES = ["text","entries","lines"];
const LINE_LAYOUTS = { pipe:"Lines, split on |", bullet:"Bulleted list", plain:"Plain lines" };

/* Headings an ATS is likely to recognise. Anything else still renders — the
   analyser just warns, because a parser that can't place a heading may drop it. */
const STANDARD_HEADINGS = [
  "summary","professional summary","objective","profile",
  "experience","work experience","professional experience","employment history","employment",
  "projects","education","skills","technical skills","core skills",
  "certifications","licenses","awards","publications","languages","volunteering","volunteer experience"
];

const SECTION_PRESETS = [
  { label:"Experience",      type:"entries", title:"Experience" },
  { label:"Volunteering",    type:"entries", title:"Volunteering" },
  { label:"Summary",         type:"text",    title:"Summary" },
  { label:"Education",       type:"lines",   title:"Education",       layout:"pipe",   hint:"TU Berlin | BSc Computer Science | 2019" },
  { label:"Projects",        type:"lines",   title:"Projects",        layout:"bullet", hint:"Ledger | Double-entry bookkeeping library | github.com/you/ledger" },
  { label:"Skills",          type:"lines",   title:"Skills",          layout:"plain",  hint:"Languages: Python, Go, TypeScript" },
  { label:"Certifications",  type:"lines",   title:"Certifications",  layout:"pipe",   hint:"CKA | Linux Foundation | 2024" },
  { label:"Awards",          type:"lines",   title:"Awards",          layout:"pipe",   hint:"Best Paper | ACM SIGCOMM | 2023" },
  { label:"Publications",    type:"lines",   title:"Publications",    layout:"bullet", hint:"Title | venue | year" },
  { label:"Languages",       type:"lines",   title:"Languages",       layout:"plain",  hint:"German — fluent" },
  { label:"Most proud of",   type:"lines",   title:"Most Proud Of",   layout:"bullet", hint:"One achievement per line" },
  { label:"Strengths",       type:"lines",   title:"Strengths",       layout:"bullet", hint:"One per line" },
  { label:"Passions",        type:"lines",   title:"Passions",        layout:"bullet", hint:"One per line" },
  { label:"Custom section",  type:"lines",   title:"New Section",     layout:"bullet", hint:"One per line" }
];

const HINT_BY_TITLE = Object.fromEntries(SECTION_PRESETS.filter(p=>p.hint).map(p=>[p.title.toLowerCase(), p.hint]));
const blankEntry = () => ({ id:uid(), role:"", company:"", start:"", end:"", location:"", bullets:"" });

function sectionFromPreset(preset){
  const base = { id:uid(), type:preset.type, title:preset.title };
  if(preset.type==="text")    return { ...base, text:"" };
  if(preset.type==="entries") return { ...base, entries:[blankEntry()] };
  return { ...base, raw:"", layout:preset.layout||"bullet" };
}

/* Fills in whatever a stored section is missing, so a hand-edited backup or a
   half-written record renders instead of throwing. */
function normaliseSection(s){
  const type = SECTION_TYPES.includes(s?.type) ? s.type : "lines";
  const base = { id:s?.id||uid(), type, title:String(s?.title||"Section") };
  if(type==="text")    return { ...base, text:String(s.text||"") };
  if(type==="entries") return { ...base, entries:(Array.isArray(s.entries)?s.entries:[]).map(e=>({...blankEntry(), ...e, id:e?.id||uid()})) };
  return { ...base, raw:String(s.raw||""), layout:LINE_LAYOUTS[s.layout] ? s.layout : "pipe" };
}

const BLANK = {
  contact:{name:"",title:"",email:"",phone:"",location:"",links:""},
  sections:[
    { id:"summary",    type:"text",    title:"Summary",    text:"" },
    { id:"experience", type:"entries", title:"Experience", entries:[] },
    { id:"projects",   type:"lines",   title:"Projects",   raw:"", layout:"bullet" },
    { id:"education",  type:"lines",   title:"Education",  raw:"", layout:"pipe" },
    { id:"skills",     type:"lines",   title:"Skills",     raw:"", layout:"plain" }
  ]
};

/* Profiles written before sections existed were a fixed set of named fields.
   Entry ids are carried across unchanged — tailored overlays and saved
   documents key off them, so losing one would orphan every saved version. */
function migrateProfile(raw){
  if(!raw || typeof raw!=="object") return clone(BLANK);
  if(Array.isArray(raw.sections))
    return { contact:{...BLANK.contact, ...(raw.contact||{})}, sections:raw.sections.map(normaliseSection) };

  const p = clone(BLANK);
  p.contact = { ...p.contact, ...(raw.contact||{}) };
  const put = (id, patch) => { const s = p.sections.find(x=>x.id===id); if(s) Object.assign(s, patch); };
  put("summary",   { text: raw.summary || "" });
  put("experience",{ entries: (raw.experience||[]).map(e=>({ ...blankEntry(), ...e, id:e.id||uid() })) });
  put("projects",  { raw: raw.projectsRaw  || "" });
  put("education", { raw: raw.educationRaw || "" });
  put("skills",    { raw: raw.skillsRaw    || "" });
  return p;
}

/* Overlays used to carry a single `summary`; they now key text by section id. */
function migrateOverlay(t){
  if(!t) return null;
  const texts = { ...(t.texts||{}) };
  if(t.summary && !texts.summary) texts.summary = t.summary;
  return { bullets: t.bullets || {}, texts };
}

/* Import merges into a matching section when one exists, rather than stacking
   a second "Skills" underneath the first. */
function ensureSection(title, type, layout){

/* ============================ storage ============================ */
const KEY_PROFILE = "bench:profile";
const KEY_JD = "bench:jd";
const KEY_DOCS = "bench:documents";
const KEY_DESIGN = "bench:design";
const SAVE_DEBOUNCE_MS = 600;

/* window.storage only exists inside a claude.ai artifact; localStorage is the local path. */
const store = {
  async get(k){
    if(window.storage) return (await window.storage.get(k))?.value ?? null;
    return localStorage.getItem(k);
  },
  async set(k,v){
    if(window.storage) return window.storage.set(k,v);
    localStorage.setItem(k,v);
  }
};

let saveTimer;
async function save(){
  clearTimeout(saveTimer);
  saveTimer = setTimeout(async ()=>{
    try{
      await store.set(KEY_PROFILE, JSON.stringify(S.profile));
      await store.set(KEY_JD, S.jd);
      await store.set(KEY_DOCS, JSON.stringify(S.documents));
      await store.set(KEY_DESIGN, JSON.stringify(S.design));
      flash("Saved");
    }catch(e){
      console.error("resumebench: save failed", e);
      flash("Not saved — storage is blocked or full");
    }
  }, SAVE_DEBOUNCE_MS);
}
function flash(t){ const el=document.getElementById("saved"); el.textContent=t; setTimeout(()=>{if(el.textContent===t)el.textContent="";},2200); }
async function load(){

  }

/* ============================ documents ============================ */
/* A document is a saved projection: the posting it was aimed at, the tailored
   overlay, and where the application stands. The master is never copied into
   one — reopening re-projects over current truth, so fixing a typo in Profile
   fixes it everywhere. Same invariant as S.tailored, just persisted. */
const DOC_STATUSES = ["draft","applied","interviewing","offer","closed"];
const BACKUP_APP = "resumebench";
const BACKUP_VERSION = 2;

const nowISO = () => new Date().toISOString();
const shortDate = iso => {
  const d = new Date(iso);
  return isNaN(d) ? "" : d.toLocaleDateString(undefined,{month:"short",day:"numeric"});
};
const activeDoc = () => S.documents.find(d=>d.id===S.activeDocId) || null;
const docTitle = d => [d.company,d.role].filter(Boolean).join(" — ") || "Untitled";

/* Everything that makes one saved version differ from another. */
function projection(){
  return { jd:S.jd, tailored:clone(S.tailored), keywords:clone(S.keywords)||[], score:clone(S.score), design:clone(S.design) };
}
function draftNames(){
  return { company:S.docDraft.company.trim(), role:S.docDraft.role.trim() };
}

function createDocument(){
  const doc = { id:uid(), status:"draft", createdAt:nowISO(), updatedAt:nowISO(),
                ...draftNames(), ...projection() };
  S.documents.unshift(doc);
  S.activeDocId = doc.id;
  save();
  return doc;
}
function updateDocument(){
  const doc = activeDoc();
  if(!doc) return createDocument();
  Object.assign(doc, projection(), draftNames(), {updatedAt:nowISO()});
  save();
  return doc;
}
function openDocument(id){
  const doc = S.documents.find(d=>d.id===id);
  if(!doc) return;
  S.activeDocId = doc.id;
  S.jd = doc.jd || "";
  S.tailored = migrateOverlay(doc.tailored);
  S.keywords = clone(doc.keywords) || [];
  S.score = clone(doc.score);
  if(doc.design) S.design = {...DEFAULT_DESIGN, ...doc.design};
  S.docDraft = { company:doc.company||"", role:doc.role||"" };
  S.showTailored = true;
  save();
}
/* Detaches from the saved version and drops the overlay. The posting stays —
   the usual reason to come back to master is to retailor against it. */
function closeDocument(){
  S.activeDocId = null; S.tailored = null; S.keywords = []; S.score = null;
  S.docDraft = { company:"", role:"" };
  save();
}
function deleteDocument(id){
  const wasOpen = S.activeDocId === id;
  S.documents = S.documents.filter(d=>d.id!==id);
  if(wasOpen) closeDocument(); else save();
}

/* ---- backup: the answer to "what if I clear my browser data" ---- */
function exportBackup(){
  const payload = { app:BACKUP_APP, version:BACKUP_VERSION, exportedAt:nowISO(),
                    profile:S.profile, design:S.design, documents:S.documents };
  const url = URL.createObjectURL(new Blob([JSON.stringify(payload,null,2)],{type:"application/json"}));
  const a = document.createElement("a");
  a.href = url;
  a.download = `resumebench-${nowISO().slice(0,10)}.json`;

/* Back to a blank bench. Deliberately does not remove the storage keys — it
   writes the defaults over them, which is the same thing from the app's side
   and keeps `store` at the two methods a backend would have to implement. */
function resetEverything(){

/* Restore replaces rather than merges — predictable beats clever when there is no undo. */
async function importBackup(file){
  let data;
  try{ data = JSON.parse(await file.text()); }
  catch(e){ throw new Error("That file isn't valid JSON."); }
  if(data.app !== BACKUP_APP || !data.profile)
    throw new Error("That file isn't a resumebench backup.");
  const docs = Array.isArray(data.documents) ? data.documents : [];
  const ok = confirm(
    `Restore the profile and ${docs.length} saved resume${docs.length===1?"":"s"} from this file?\n\n` +
    `This replaces what's in the browser now, and there's no undo. Export a backup first if you want to keep it.`
  );
  if(!ok) return false;
  S.profile = migrateProfile(data.profile);
  S.documents = docs.map(d=>({...d, tailored:migrateOverlay(d.tailored)}));
  if(data.design) S.design = {...DEFAULT_DESIGN, ...data.design};
  closeDocument();
  flash("Backup restored");
  return true;
}

/* ============================ model ============================ */
const RULES = `Hard rules:
- Never invent, inflate, or estimate a metric, title, date, tool, or outcome that is not present in the source material. If a number is missing, write the bullet without one.
- Keep every claim defensible in an interview.
- Plain text only: no markdown, no emoji, no special glyphs.`;

/* The local proxy in proxy.mjs holds the API key, so it never enters this page. */
const API_ENDPOINT = "http://localhost:8787/v1beta/interactions";
const MODEL = "gemini-3.6-flash";

/* The free tier's limits are per-account and unpublished, so pace by reacting
   to 429s rather than guessing an interval. A tailor run fires one call per
   role back to back, which is where a limit gets hit. */
const RETRY_STATUSES = [429, 500, 503];
const MAX_ATTEMPTS = 4;
const BACKOFF_MS = 2000;
const sleep = ms => new Promise(r=>setTimeout(r,ms));

/* Google sometimes wraps a payload in a single-element array — its error
   responses do. Unwrap before reading either shape. */
const unwrap = d => Array.isArray(d) ? d[0] : d;

async function apiError(res){
  const body = await res.text().catch(()=>"");
  let err = {};
  try{ err = unwrap(JSON.parse(body))?.error ?? {}; }catch(e){}
  const reason = err.details?.find(d=>d.reason)?.reason || err.status || "";

  if(reason==="API_KEY_INVALID" || res.status===401 || res.status===403)
    return "Google rejected the API key. Check GEMINI_API_KEY in .env, then restart the proxy.";
  if(res.status===429)
    return "Rate limited by the free tier, and the retries didn't clear it. Wait a minute, then run it again.";
  const detail = err.message || body.slice(0,200);
  return `Model returned ${res.status}.${detail?" "+detail:""}`;
}

/* The answer lives in `steps`, in the entries typed `model_output`. Two traps,
   both verified against live responses:
     - `output_text` is an SDK convenience property and is NOT in the REST
       payload. Kept below only as a fallback if that ever changes.
     - a `thought` step (reasoning, no content) sits before the answer, and
       `user_input` may echo the prompt. Filtering to model turns is what stops
       either from being concatenated onto the answer and breaking the parse. */
const MODEL_STEP_TYPES = ["model_output", "model_response"];

function readText(payload){
  const data = unwrap(payload) ?? {};
  if(typeof data.output_text === "string" && data.output_text) return data.output_text;
  return (data.steps||[])
    .filter(s=>MODEL_STEP_TYPES.includes(s.type))
    .flatMap(s=>s.content||[])
    .filter(b=>b.type==="text")
    .map(b=>b.text).join("\n");
}

async function ask(prompt, {json=false}={}){
  const body = JSON.stringify({
    model: MODEL,
    input: prompt,
    ...(json ? {response_format:{type:"text", mime_type:"application/json"}} : {})
  });

  for(let attempt=1; ; attempt++){
    let res;
    try{
      res = await fetch(API_ENDPOINT,{ method:"POST", headers:{"Content-Type":"application/json"}, body });
    }catch(e){
      console.error("resumebench: proxy unreachable", e);
      throw new Error("Can't reach the local proxy. Start it with: node proxy.mjs");
    }
    if(res.ok) return readText(await res.json());

    if(RETRY_STATUSES.includes(res.status) && attempt < MAX_ATTEMPTS){
      const header = Number(res.headers.get("Retry-After"));
      const wait = Number.isFinite(header) && header > 0 ? header*1000 : BACKOFF_MS * 2**(attempt-1);
      const resume = S.busy;
      S.busy = `Rate limited — retrying in ${Math.round(wait/1000)}s…`; render();
      await sleep(wait);
      S.busy = resume;
      continue;
    }
    throw new Error(await apiError(res));
  }
}
async function askJSON(prompt){
  const raw = await ask(prompt + "\n\nRespond with JSON only. No preamble, no code fences.", {json:true});
  const clean = raw.replace(/```json/g,"").replace(/```/g,"").trim();
  const start = Math.min(...[clean.indexOf("{"),clean.indexOf("[")].filter(i=>i>=0));
  return JSON.parse(clean.slice(isFinite(start)?start:0));
}
async function run(label, fn){
  S.busy = label; S.error=""; render();
  try{ await fn(); }
  catch(e){ S.error = e instanceof SyntaxError ? "The model returned something unreadable. Run it again." : e.message; }
  S.busy=""; render();
}

/* ============================ resume text ============================ */
/* The overlay is read here and nowhere else. Everything downstream — the paper,
   the plain-text copy, the analyser — goes through these two. */
function activeEntries(section){
  return section.entries.map(e=>{
    const t = S.tailored && S.showTailored && S.tailored.bullets[e.id];
    return { ...e, bullets: t ? t : lines(e.bullets) };
  });
}
function activeText(section){
  const t = S.tailored && S.showTailored && S.tailored.texts && S.tailored.texts[section.id];
  return t || section.text || "";
}
/* A lines section as display strings: "a | b | c" becomes "a — b — c". */
function activeLines(section){
  return lines(section.raw).map(l =>
    section.layout==="plain" ? l : l.split("|").map(x=>x.trim()).filter(Boolean).join(" — "));
}
function sectionIsEmpty(s){
  if(s.type==="text")    return !activeText(s).trim();
  if(s.type==="entries") return !s.entries.length;
  return !activeLines(s).length;
}

function plainText(){
  const c = S.profile.contact, out = [];
  out.push(c.name||"Your Name");
  if(c.title) out.push(c.title);
  out.push([c.email,c.phone,c.location,c.links].filter(Boolean).join(" | "));
  for(const s of sections()){
    if(sectionIsEmpty(s)) continue;
    out.push("", s.title.toUpperCase());
    if(s.type==="text"){ out.push(activeText(s)); continue; }
    if(s.type==="entries"){
      activeEntries(s).forEach(e=>{
        out.push("", `${e.role||"Role"}, ${e.company||"Company"}`);
        out.push([[e.start,e.end].filter(Boolean).join(" - "), e.location].filter(Boolean).join(" | "));
        e.bullets.forEach(b=>out.push("- "+b));
      });
      continue;
    }
    activeLines(s).forEach(l => out.push(s.layout==="plain" ? l : "- "+l));
  }
  return out.join("\n");
}
/* keyword highlighting: escape first, then mark */
function mark(text){
  let out = esc(text);
  if(!(S.tailored && S.showTailored) || !S.keywords.length) return out;
  const terms = S.keywords.map(k=>k.term).filter(t=>t&&t.length>2)
    .sort((a,b)=>b.length-a.length)
    .map(t=>t.replace(/[.*+?^${}()|[\]\\]/g,"\\$&"));
  if(!terms.length) return out;
  try{
    out = out.replace(new RegExp("(?<![\\w-])("+terms.join("|")+")(?![\\w-])","gi"), '<span class="hl">$1</span>');
  }catch(e){
    out = out.replace(new RegExp("\\b("+terms.join("|")+")\\b","gi"), '<span class="hl">$1</span>');
  }
  return out;
}

/* The ATS guarantees live here: real headings, real text, real lists, one
   column — regardless of what the model returned. `sidebar` is the one template
   that breaks the single-column rule, and the analyser says so out loud. */
function sectionHTML(s){
  const h = [`<h2>${mark(s.title)}</h2>`];
  if(s.type==="text"){ h.push(`<div>${mark(activeText(s))}</div>`); return h.join(""); }
  if(s.type==="entries"){
    activeEntries(s).forEach(e=>{
      h.push(`<div class="job">
        <div class="l1"><span>${mark(e.role)||"Role"}</span><span>${esc([e.start,e.end].filter(Boolean).join(" – "))}</span></div>
        <div class="l2"><span>${mark(e.company)}</span><span>${esc(e.location)}</span></div>
        ${e.bullets.length?`<ul>${e.bullets.map(b=>`<li>${mark(b)}</li>`).join("")}</ul>`:""}
      </div>`);
    });
    return h.join("");
  }
  const ls = activeLines(s);
  h.push(s.layout==="bullet"
    ? `<ul>${ls.map(l=>`<li>${mark(l)}</li>`).join("")}</ul>`
    : ls.map(l=>`<div class="skill-line">${mark(l)}</div>`).join(""));
  return h.join("");
}

/* Sidebar splits by type, not by a per-section flag: list sections are the
   short ones that read fine in a narrow column, entries need the width. */
const goesInSidebar = s => s.type==="lines";

function renderPaper(){
  const paper = document.getElementById("paper");
  const c = S.profile.contact;
  const design = S.design;
  paper.dataset.template = design.template;
  paper.dataset.density  = design.density;
  paper.style.setProperty("--accent", design.accent);

  const head = `<h1>${esc(c.name)||'<span class="placeholder">Your name</span>'}</h1>`
    + `<div class="contact">${[c.email,c.phone,c.location,c.links].filter(Boolean).join(" &nbsp;|&nbsp; ")
        || '<span class="placeholder">email · phone · city · linkedin</span>'}</div>`;

  const filled = sections().filter(s=>!sectionIsEmpty(s));
  let body;
  if(design.template==="sidebar" && filled.some(goesInSidebar) && filled.some(s=>!goesInSidebar(s))){
    body = `<div class="cols">
      <aside>${filled.filter(goesInSidebar).map(sectionHTML).join("")}</aside>
      <div class="main">${filled.filter(s=>!goesInSidebar(s)).map(sectionHTML).join("")}</div>
    </div>`;
  }else{
    body = filled.map(sectionHTML).join("");
  }

  const empty = !filled.length && !c.name
    ? `<div class="placeholder" style="margin-top:24px">Nothing here yet. Fill in the profile on the left, or paste an old resume to import it.</div>`
    : "";
  paper.innerHTML = head + body + empty;
}

/* ============================ analyser (no API) ============================ */
/* Runs on every keystroke, so it stays local and cheap. Every finding names the
   thing to change; a score with no next action is decoration. */
const FILLER = [
  "responsible for","worked on","helped with","assisted with","involved in","duties included",
  "tasked with","hard worker","team player","detail-oriented","results-driven","self-starter",
  "go-getter","think outside the box","synergy","proven track record","passionate about",
  "wide range of","various","utilised","utilized"
];
const STRONG_OPENER = /^(led|built|shipped|cut|grew|drove|designed|launched|migrated|reduced|increased|owned|rebuilt|automated|scaled|delivered|negotiated|mentored|introduced|eliminated|consolidated|streamlined|architected|wrote|developed|created|improved|implemented|established|managed|ran|founded|rewrote|ported|fixed|resolved|tested|measured|analys|analyz|trained|hired|coached|published|presented|sold|closed|raised|saved|removed|replaced|standardi|integrated|deployed|monitored|refactored|optimi|secured|shaped|halved|doubled|tripled|expanded|simplified|unified|documented|instrumented|benchmarked)/i;
const MAX_BULLET_CHARS = 210;
const LONG_BULLET_CHARS = 230;
const TWO_PAGE_WORDS = 800;

function analyse(){
  const c = S.profile.contact;
  const entries = allEntries();
  const bullets = entrySections().flatMap(s=>activeEntries(s)).flatMap(e=>e.bullets);
  const words = plainText().split(/\s+/).filter(Boolean).length;
  const g = { Contact:[], Structure:[], Content:[], ATS:[] };
  const add = (group, level, text) => g[group].push({level, text});

  /* ---- contact ---- */
  if(!c.name)     add("Contact","fail","No name on the resume.");
  if(!c.email)    add("Contact","fail","No email address — many parsers key the whole record off it.");
  if(!c.phone)    add("Contact","warn","No phone number.");
  if(!c.location) add("Contact","warn","No location. Recruiters filter on it.");
  if(!c.links)    add("Contact","warn","No LinkedIn or portfolio link.");
  if(c.name && c.email && c.phone && c.location && c.links) add("Contact","pass","Contact block is complete.");

  /* ---- structure ---- */
  const filled = sections().filter(s=>!sectionIsEmpty(s));
  if(!filled.length) add("Structure","fail","Every section is empty.");
  if(!entries.length) add("Structure","fail","No experience entries yet.");
  entries.forEach(e=>{
    if(!e.start || !e.end) add("Structure","warn",`${e.company||e.role||"A role"} is missing a date — use MM/YYYY or "Present".`);
  });
  entries.forEach(e=>{
    const n = lines(e.bullets).length;
    if(n && n > 6) add("Structure","warn",`${e.role||e.company||"A role"} has ${n} bullets. Six is plenty; cut the weakest.`);
  });
  if(sections().some(s=>s.type==="lines" && /skill/i.test(s.title) && !sectionIsEmpty(s)))
    add("Structure","pass","Skills section present — that's where keyword matching usually lands.");
  else
    add("Structure","warn","No skills section — this is where keyword matching usually happens.");
  if(words > TWO_PAGE_WORDS) add("Structure","warn",`${words} words. Over roughly ${TWO_PAGE_WORDS} you're onto page three.`);
  else if(words) add("Structure","pass",`${words} words — inside two pages.`);

  /* ---- content ---- */
  if(bullets.length){
    const long = bullets.filter(b=>b.length>LONG_BULLET_CHARS);
    if(long.length) add("Content","warn",`${long.length} bullet${long.length>1?"s run":" runs"} past two lines. Cut to one idea each.`);

    const noNum = bullets.filter(b=>!/\d/.test(b));
    if(noNum.length/bullets.length > .6)
      add("Content","warn",`${noNum.length} of ${bullets.length} bullets have no number. Scope or result, pick one.`);
    else if(noNum.length===0) add("Content","pass","Every bullet carries a number.");

    const weak = bullets.filter(b=>FILLER.some(w=>b.toLowerCase().includes(w)));
    if(weak.length) add("Content","warn",`${weak.length} bullet${weak.length>1?"s use":" uses"} filler ("${FILLER.find(w=>weak[0].toLowerCase().includes(w))}"). Say what you did instead.`);

    const soft = bullets.filter(b=>!STRONG_OPENER.test(b.trim()));
    if(soft.length) add("Content","warn",`${soft.length} bullet${soft.length>1?"s don't":" doesn't"} open with a strong past-tense verb.`);
    else add("Content","pass","Every bullet opens with an action verb.");

    const over = bullets.filter(b=>b.length>MAX_BULLET_CHARS && b.length<=LONG_BULLET_CHARS);
    if(over.length) add("Content","warn",`${over.length} bullet${over.length>1?"s are":" is"} just over ${MAX_BULLET_CHARS} characters.`);
  }
  const summarySection = sections().find(s=>s.type==="text" && !sectionIsEmpty(s));
  if(summarySection){
    const sw = activeText(summarySection).split(/\s+/).filter(Boolean).length;
    if(sw > 60) add("Content","warn",`${summarySection.title} runs ${sw} words. Two sentences reads better.`);
  }

  /* ---- ats ---- */
  const tpl = TEMPLATES[S.design.template];
  if(tpl && !tpl.safe) add("ATS","fail",`The ${tpl.label} template is two-column. Some parsers read it out of order — use ATS plain for uploads.`);
  else add("ATS","pass","Single column, real selectable text, no tables or text boxes.");
  const odd = filled.filter(s=>!isStandard(s.title));
  if(odd.length) add("ATS","warn",`Non-standard heading${odd.length>1?"s":""}: ${odd.map(s=>s.title).join(", ")}. Renders fine; a parser may not know where to file it.`);

  const flat = Object.values(g).flat();
  const penalty = flat.reduce((n,x)=>n + (x.level==="fail"?9:x.level==="warn"?4:0), 0);
  return { score: Math.max(0, 100 - penalty), groups: g };
}

function parserCheck(){
  const { score, groups } = analyse();
  const body = Object.entries(groups).filter(([,v])=>v.length).map(([name,items])=>
    `<div class="ck-group"><h5>${esc(name)}</h5><ul>${
      items.map(i=>`<li class="${i.level==="pass"?"pass":"warn"}${i.level==="fail"?" bad":""}">${esc(i.text)}</li>`).join("")
    }</ul></div>`).join("");
  document.getElementById("check").innerHTML =
    `<h4>Content check · runs locally<span class="ck-score" data-band="${score>=85?"good":score>=65?"ok":"low"}">${score}<small>/100</small></span></h4>${body}`;
}

document.getElementById("tools").addEventListener("input", e=>{
  const el=e.target, d=el.dataset;
  /* Cheap path only: a full render() here would blow away focus mid-typing. */
  const cheap = ()=>{ renderPaper(); parserCheck(); save(); };
  if(d.c){ S.profile.contact[d.c]=el.value; cheap(); }
  else if(d.stext){  const s=sectionById(d.stext);  if(s){ s.text=el.value;  cheap(); } }
  else if(d.sraw){   const s=sectionById(d.sraw);   if(s){ s.raw=el.value;   cheap(); } }
  else if(d.stitle){ const s=sectionById(d.stitle); if(s){ s.title=el.value; cheap(); } }

  else if(el.id==="jd"||el.id==="jd2"){ S.jd=el.value; save(); }
  else if(el.id==="notes"){ S.notesDraft=el.value; }

    S.error = err.message;

document.getElementById("tools").addEventListener("click", async e=>{
  const b=e.target.closest("button"); if(!b) return;
  const act=b.dataset.act;

  /* ---- sections ---- */
  if(b.id==="addSection"){
    const preset = SECTION_PRESETS[Number(document.getElementById("presetSel").value)];
    if(preset){ sections().push(sectionFromPreset(preset)); save(); render(); }
    return;
  }
  if(act==="secUp"||act==="secDown"){
    const list = sections();
    const i = list.findIndex(s=>s.id===b.dataset.id);
    const j = act==="secUp" ? i-1 : i+1;
    if(i>=0 && j>=0 && j<list.length){
      [list[i],list[j]]=[list[j],list[i]];
      save(); render();
    }
    return;
  }
  if(act==="secToggle"){ S.collapsed[b.dataset.id]=!S.collapsed[b.dataset.id]; render(); return; }
  if(act==="secDel"){
    const s = sectionById(b.dataset.id);
    if(s && confirm(`Remove the ${s.title} section and everything in it? There's no undo.`)){
      S.profile.sections = sections().filter(x=>x.id!==s.id);
      save(); render();
    }
    return;
  }
  if(act==="entryAdd"){
    const s = sectionById(b.dataset.id);
    if(s && s.type==="entries"){ s.entries.push(blankEntry()); save(); render(); }
    return;
  }
  if(act==="entryDel"){
    const s = sectionById(b.dataset.sec);
    if(s){ s.entries = s.entries.filter(en=>en.id!==b.dataset.id); save(); render(); }
    return;
  }
  if(act==="entryUp"){
    const s = sectionById(b.dataset.sec);
    if(s){
      const i = s.entries.findIndex(en=>en.id===b.dataset.id);
      if(i>0){ [s.entries[i-1],s.entries[i]]=[s.entries[i],s.entries[i-1]]; save(); render(); }
    }
    return;
  }

  /* ---- design ---- */
  if(act==="tpl"){     S.design.template=b.dataset.id; save(); render(); return; }
  if(act==="accent"){  S.design.accent=b.dataset.id;   save(); render(); return; }
  if(act==="density"){ S.design.density=b.dataset.id;  save(); render(); return; }

  /* ---- tighten one entry's bullets in place ---- */
  if(act==="polish"){
    const en = findEntry(b.dataset.id);
    if(!en) return;
    const src = lines(en.bullets);
    if(!src.length) return;
    await run("Tightening…", async ()=>{
      const out = await askJSON(
`Tighten these resume bullets. Same facts, same numbers, fewer words. Cut filler and passive openers, lead each with a past-tense verb. Do not merge, add, or drop bullets — return exactly ${src.length}, in the same order.
${RULES}
Each bullet: one sentence, under ${MAX_BULLET_CHARS} characters, no first person.

Shape: {"bullets":["",""]}

BULLETS:
${src.map(x=>"- "+x).join("\n")}`);
      if(Array.isArray(out.bullets) && out.bullets.length) en.bullets = out.bullets.join("\n");
      save();
    });
    return;
  }

  if(act==="copyBullet"){
    try{ await navigator.clipboard.writeText(S.variants.bullets[b.dataset.i]); flash("Copied"); }catch(err){ flash("Clipboard blocked"); }
    return;
  }
  if(act==="addBullet"){
    const sel=document.querySelector(`[data-vsel="${b.dataset.i}"]`);
    const en=findEntry(sel.value);
    if(en){ en.bullets=(en.bullets?en.bullets+"\n":"")+S.variants.bullets[b.dataset.i]; save(); flash("Added to "+(en.role||"role")); render(); }
    return;
  }

  /* ---- saved documents ---- */
  if(b.id==="saveDoc"){ updateDocument(); flash("Version saved"); render(); return; }
  if(b.id==="saveDocNew"){ createDocument(); flash("Saved as new"); render(); return; }
  if(b.id==="closeDoc"||b.id==="clearTailor"){ closeDocument(); render(); return; }
  if(act==="openDoc"){ openDocument(b.dataset.id); S.mode="tailor"; S.error=""; render(); return; }
  if(act==="delDoc"){
    const doc=S.documents.find(d=>d.id===b.dataset.id);
    if(doc && confirm(`Delete the ${docTitle(doc)} version? There's no undo.`)){ deleteDocument(doc.id); render(); }
    return;
  }
  if(b.id==="doExport"){ exportBackup(); return; }
  if(b.id==="resetAsk"){    S.confirmReset=true;  render(); return; }
  if(b.id==="resetCancel"){ S.confirmReset=false; render(); return; }
  if(b.id==="resetExport"){ exportBackup(); return; }   /* stays open — the export is optional, not a gate */
  if(b.id==="resetGo"){     resetEverything(); render(); return; }
  if(b.id==="doImport"){ document.getElementById("backupFile").click(); return; }

  /* ---- import ---- */
  if(b.id==="doImport"){
    const txt=document.getElementById("importText").value.trim();
    if(!txt){ S.error="Paste something first."; render(); return; }
    await run("Reading it…", async ()=>{
      const out = await askJSON(
`Extract structured resume data from the text below. Use only what is written there — do not add, guess, or embellish anything.
${RULES}

Shape:
{"contact":{"name":"","title":"","email":"","phone":"","location":"","links":""},
 "summary":"",
 "experience":[{"role":"","company":"","start":"MM/YYYY","end":"MM/YYYY or Present","location":"","bullets":["",""]}],
 "education":["School | Degree | Year"],
 "skills":["Category: a, b, c"],
 "projects":["Name | description | link"]}

TEXT:
${txt}`);
      S.profile.contact={...S.profile.contact,...(out.contact||{})};
      if(out.summary) ensureSection("Summary","text").text = out.summary;
      if((out.experience||[]).length){
        const target = entrySections()[0] || ensureSection("Experience","entries");
        (out.experience||[]).forEach(r=>target.entries.push({
          ...blankEntry(), role:r.role||"", company:r.company||"", start:r.start||"", end:r.end||"",
          location:r.location||"", bullets:(r.bullets||[]).join("\n")
        }));
      }
      if((out.education||[]).length) ensureSection("Education","lines","pipe").raw   = out.education.join("\n");
      if((out.skills||[]).length)    ensureSection("Skills","lines","plain").raw     = out.skills.join("\n");
      if((out.projects||[]).length)  ensureSection("Projects","lines","bullet").raw  = out.projects.join("\n");
      save();
    });
    return;
  }

  /* ---- gap questions ---- */
  if(b.id==="doGaps"){
    await run("Looking for the holes…", async ()=>{
      const out = await askJSON(
`You are a blunt resume coach. Read this profile and ask the 5 questions whose answers would most improve it — target vague scope, missing numbers, unclear ownership, and unexplained gaps. Ask about what is actually there. Be specific: name the role or bullet.

Shape: {"questions":["",""]}

PROFILE:
${plainText()}`);
      S.questions = out.questions||[];
    });
    return;
  }

  /* ---- bullets ---- */
  if(b.id==="doBullets"){
    const notes=document.getElementById("notes").value.trim();
    const target=document.getElementById("targetRole").value.trim();
    if(!notes){ S.error="Describe what you did first."; render(); return; }
    await run("Writing…", async ()=>{
      S.variants = await askJSON(
`Turn these rough notes into three resume bullets. Each is the same truth in a different shape: one leading with the result, one leading with the action and scope, one leading with the problem solved.
${RULES}
Each bullet: one sentence, under 210 characters, starts with a past-tense verb, no first person, no "responsible for" or "helped with". Where the notes lack a number, write it honestly without one — then ask for that number in questions.
${target?`Target role: ${target}. Emphasise what that role would care about, without changing the facts.`:""}

Shape: {"bullets":["","",""],"questions":["",""]}

NOTES:
${notes}`);
    });
    return;
  }

  /* ---- tailor ---- */
  if(b.id==="doTailor"){
    const jd=(document.getElementById("jd")||{}).value?.trim()||S.jd.trim();
    if(!jd){ S.error="Paste the job posting first."; render(); return; }
    if(!allEntries().length){ S.error="Add at least one role in Profile first."; render(); return; }
    S.jd=jd; save();

    await run("Reading the posting…", async ()=>{
      const kw = await askJSON(
`Extract the concrete requirements a screener would match against: tools, technologies, methods, domains, credentials. Skip generic filler like "team player" or "fast-paced". At most 16, each 1-4 words, using the posting's own wording. Also read off the hiring company and the role title exactly as the posting writes them — use "" for either if it doesn't say.

Shape: {"company":"","role":"","keywords":["",""]}

POSTING:
${jd}`);
      const resumeText = plainText().toLowerCase();
      S.keywords = (kw.keywords||[]).map(t=>({term:t, hit:resumeText.includes(String(t).toLowerCase())}));
      /* Prefill the save form, but never overwrite names on a version already open. */
      if(!S.activeDocId) S.docDraft = { company:kw.company||"", role:kw.role||"" };

      /* One call per entry, not one for the whole resume: it bounds each
         response, isolates a failure to one role, and drives the progress line. */
      const bullets={};
      for(const sec of entrySections()){
        for(const en of sec.entries){
          S.busy = `Tailoring ${en.role||en.company||"role"}…`; render();
          const src=lines(en.bullets);
          if(!src.length){ bullets[en.id]=[]; continue; }
          const out = await askJSON(
`Rewrite this role's bullets for the posting below. Keep the 3-5 most relevant, drop the rest, order them most-relevant first.
${RULES}
Mirror the posting's vocabulary only where the source already describes that same thing. Keep every existing number exactly as written. One sentence each, under ${MAX_BULLET_CHARS} characters, past-tense verb first.

Shape: {"bullets":["",""]}

ROLE: ${en.role} at ${en.company}
SOURCE BULLETS:
${src.map(x=>"- "+x).join("\n")}

POSTING:
${jd}`);
          bullets[en.id]=out.bullets||src;
        }
      }

      const texts={};
      for(const sec of sections().filter(s=>s.type==="text" && s.text.trim())){
        S.busy=`Adjusting ${sec.title.toLowerCase()}…`; render();
        const out=await askJSON(
`Rewrite this ${sec.title} section so it lands for the posting below. Two sentences maximum, written about the candidate — never about the job. Use only what the section already says; if the posting wants something the candidate has not done, leave it out rather than implying it. Do not list the posting's requirements back.
${RULES}
Shape: {"text":""}

${sec.title.toUpperCase()}: ${sec.text}
POSTING: ${jd}`);
        if(out.text) texts[sec.id]=out.text;
      }
      S.tailored={bullets,texts}; S.showTailored=true;
    });
    return;
  }

  /* ---- score ---- */
  if(b.id==="doScore"){
    const jd=(document.getElementById("jd2")||{}).value?.trim()||S.jd.trim();
    if(!jd){ S.error="Paste the posting first."; render(); return; }
    S.jd=jd; save();
    await run("Grading…", async ()=>{
      S.score = await askJSON(
`You are an ATS screener and a hiring manager at once. Grade this resume against the posting. Be strict — most resumes land between 45 and 75. Every fix must name the exact bullet or section to change and what to change it to.

Shape: {"score":0,"breakdown":[{"label":"Keyword coverage","score":0,"note":""},{"label":"Evidence and metrics","score":0,"note":""},{"label":"Relevance of experience","score":0,"note":""},{"label":"Structure and parseability","score":0,"note":""}],"fixes":["",""]}

RESUME:
${plainText()}

POSTING:
${jd}`);
    });
    return;
  }
});

/* Section reorder by drag. The ↑/↓ buttons do the same job for keyboards, so
   this stays a convenience rather than the only way through. */
let dragSectionId = null;
const toolsEl = document.getElementById("tools");

toolsEl.addEventListener("dragstart", e=>{
  if(e.target.closest("input,textarea,select,button")){ e.preventDefault(); return; }
  const card = e.target.closest("[data-drag]");
  if(!card) return;
  dragSectionId = card.dataset.drag;
  e.dataTransfer.effectAllowed = "move";
  card.classList.add("dragging");
});
toolsEl.addEventListener("dragend", e=>{
  const card = e.target.closest("[data-drag]");
  if(card) card.classList.remove("dragging");
  dragSectionId = null;
});
toolsEl.addEventListener("dragover", e=>{
  if(!dragSectionId) return;
  const over = e.target.closest("[data-drag]");
  if(!over || over.dataset.drag===dragSectionId) return;
  e.preventDefault();
  e.dataTransfer.dropEffect = "move";
});
toolsEl.addEventListener("drop", e=>{
  const over = e.target.closest("[data-drag]");
  if(!dragSectionId || !over) return;
  e.preventDefault();
  const list = sections();
  const from = list.findIndex(s=>s.id===dragSectionId);
  const to   = list.findIndex(s=>s.id===over.dataset.drag);
  dragSectionId = null;
  if(from<0 || to<0 || from===to) return;
  list.splice(to, 0, list.splice(from,1)[0]);
  save(); render();
});

/* ============================ boot ============================ */
(async ()=>{ await load(); render(); })();
</script>
